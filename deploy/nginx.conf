# Replace hostname/certificate paths before using. No deployment performed by this task.
limit_req_zone $binary_remote_addr zone=central:10m rate=20r/s;
server {
  listen 443 ssl;
  server_name central.example.invalid;
  ssl_certificate /etc/ssl/central/fullchain.pem;
  ssl_certificate_key /etc/ssl/central/privkey.pem;
  client_max_body_size 256k;
  location / {
    limit_req zone=central burst=100 nodelay;
    proxy_pass http://127.0.0.1:3022;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 180s;
    proxy_cache off;
  }
}
